<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EgyptStream — قنوات تلفزيونية مباشرة</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{--bg:#0a0c10;--bg2:#10141b;--panel:#161b25;--panel2:#1c2430;--border:#262f3d;--text:#e8edf4;--muted:#7d8a9c;--gold:#d4af37;--gold2:#f0d060;--red:#e63946;--green:#2ea043;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:#0a0c10ed;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}.logo-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#8a6d1f);display:grid;place-items:center;color:#080a0e;font-weight:900;font-size:21px}.logo h1{font-size:18px;color:var(--gold2)}.logo p{font-size:11px;color:var(--muted)}
.search{flex:1;max-width:420px}input,select,textarea{font:inherit}.search input,.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);border-radius:10px;padding:10px 16px;background:var(--panel);color:var(--text);cursor:pointer;font-weight:700}.btn:hover{border-color:var(--gold)}.gold{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#080a0e;border-color:var(--gold)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 73px)}aside{background:var(--bg2);border-left:1px solid var(--border);padding:20px 14px;position:sticky;top:73px;height:calc(100vh - 73px);overflow:auto}.side-label{font-size:11px;color:var(--muted);padding:8px 12px}.cat{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:var(--muted);cursor:pointer;margin-bottom:3px}.cat.active,.cat:hover{background:#d4af3720;color:var(--gold)}.count{margin-right:auto;background:var(--panel);border-radius:20px;padding:2px 8px;font-size:11px}
main{padding:24px;min-width:0}.player{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;box-shadow:0 18px 50px #0008}.player video{width:100%;height:100%;display:block}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:25px;background:radial-gradient(#1a2029,#090b0f)}.empty .tv{font-size:58px;opacity:.45}.empty p{color:var(--muted);line-height:1.8;max-width:500px}.overlay{display:none;position:absolute;inset:0;padding:16px;justify-content:flex-end;flex-direction:column;background:linear-gradient(transparent 60%,#000b)}.player:hover .overlay{display:flex}.controls{display:flex;align-items:center;gap:10px;background:#0009;padding:10px;border-radius:10px}.controls button{background:transparent;border:0;color:white;font-size:19px;cursor:pointer}.controls input{width:90px}.live{margin-right:auto;background:var(--gold);color:#111;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px}.section h2{font-size:20px}.section small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.card{position:relative;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.2s}.card:hover,.card.playing{border-color:var(--gold);transform:translateY(-2px)}.thumb{flex:1;display:grid;place-items:center;background:linear-gradient(135deg,var(--panel2),var(--bg2));position:relative}.initial{font-size:29px;font-weight:900;color:var(--gold)}.logo-img{width:58px;height:58px;object-fit:contain;background:white;border-radius:10px;padding:5px}.info{padding:10px;background:var(--panel2);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:5px}.name{font-size:12px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:9px;color:var(--muted);white-space:nowrap}.fav{position:absolute;left:8px;top:8px;border:0;border-radius:6px;background:#0009;color:var(--gold);font-size:18px;padding:3px 7px;cursor:pointer;z-index:2}.unavailable{position:absolute;inset:0;background:#080a0dcc;display:grid;place-items:center;color:var(--gold);font-size:11px;text-align:center;padding:10px}
.modal-bg{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow:auto}.modal h3{margin-bottom:8px}.desc{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:18px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field textarea{min-height:110px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,100px);background:var(--panel2);border:1px solid var(--gold);padding:12px 20px;border-radius:10px;z-index:50;transition:.25s}.toast.show{transform:translate(-50%,0)}.toast.error{border-color:var(--red)}.empty-grid{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid var(--border)}.side-label{display:none}.cat{white-space:nowrap;padding:8px}.count{margin-right:0}main{padding:14px}}
@media(max-width:600px){header{padding:12px}.search{order:3;flex-basis:100%;max-width:none}.logo p{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}.controls input{display:none}}
</style></head>
<body>
<header><div class="logo"><div class="logo-mark">N</div><div><h1>EgyptStream</h1><p>قنوات مصرية · بث مباشر</p></div></div><div class="search"><input id="search" placeholder="🔍 ابحث عن قناة..."></div><div class="actions"><button class="btn" onclick="openSource()">+ مصدر</button><button class="btn gold" onclick="openChannel()">+ قناة</button></div></header>
<div class="layout"><aside id="sidebar"></aside><main>
<div class="player" id="player"><video id="video" playsinline></video><div class="empty" id="empty"><div class="tv">📺</div><h3>اختر قناة للبدء</h3><p>أضف مصدر بث M3U/M3U8 أو أضف قناة يدوياً. القنوات التي لا تحتوي على رابط تحتاج إلى إضافة مصدر بث صالح.</p></div><div class="overlay" id="overlay"><div class="controls"><button onclick="togglePlay()" id="play">▶</button><button onclick="toggleMute()" id="mute">🔊</button><input id="volume" type="range" min="0" max="1" step=".05" value="1"><span class="live">LIVE</span><button onclick="reload()">⟳</button><button onclick="fullscreen()">⛶</button></div></div></div>
<div class="section"><h2 id="heading">كل القنوات</h2><small id="total"></small></div><div class="grid" id="grid"></div>
</main></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='egyptstream_v1';
const CATS=[['all','📺','كل القنوات'],['favorites','⭐','المفضلة'],['state','🏛️','القنوات الحكومية'],['private','📡','القنوات الخاصة'],['news','📰','أخبار'],['sport','⚽','رياضة'],['drama','🎭','دراما'],['cinema','🎬','سينما'],['entertainment','🎉','ترفيه'],['religious','🕌','ديني'],['kids','🧒','أطفال'],['doc','🌍','وثائقي']];
const BUILTIN=[
['ch1','القناة الأولى المصرية','state','١'],['ch2','القناة الثانية المصرية','state','٢'],['nile','نايل تي في','state','NT'],['nile-drama','نايل دراما','drama','ND'],['nile-news','نايل نيوز','news','NN'],['nile-sport','نايل سبورت','sport','NS'],['cbc','CBC','private','CBC'],['cbc-drama','CBC Drama','drama','CBCD'],['on-e','ON E','private','ONE'],['on-drama','ON Drama','drama','OND'],['on-sport','ON Sport','sport','ONS'],['mbc-masr','MBC Masr','private','MBC'],['mbc-masr-2','MBC Masr 2','private','MBC2'],['nahar','النهار','private','نهار'],['hayah','الحياة','private','حياة'],['sada','صدى البلد','private','صدى'],['kahera','القاهرة والناس','private','ق.ن'],['assema','العاصمة','private','عاص'],['mehwar','المحور','private','محو'],['dream','دريم','private','دريم'],['panorama','بانوراما فيلم','cinema','PF'],['extra-news','إكسترا نيوز','news','إكسترا'],['ghad','الغد','news','غد'],['aljazeera','الجزيرة','news','جزيرة','https://live-hls-web-aja.getaj.net/AJA/index.m3u8'],['aljazeera-doc','الجزيرة الوثائقية','doc','جزيرةD','https://live-hls-web-ajd.getaj.net/AJD/index.m3u8'],['dw-ar','DW عربية','news','DW','https://dwamdstream103.akamaized.net/hls/live/2015526/dwstream103/index.m3u8'],['france24-ar','فرانس 24 عربية','news','F24','https://static.france24.com/live/F24_AR_HI_HLS/live_web.m3u8'],['iqraa','إقرأ','religious','إقرأ'],['resala','الرسالة','religious','رسالة'],['majd','المجد','religious','مجد'],['rahma','الرحمة','religious','رحمة'],['ctv','CTV','religious','CTV'],['dmc','DMC','private','DMC'],['dmc-drama','DMC دراما','drama','DMC D'],['rotana-cinema','روتانا سينما','cinema','RC'],['toyor','طيور الجنة','kids','طيور'],['koky','كوكي','kids','كوكي'],['natgeo','ناشيونال جيوغرافيك','doc','NG'],['fatafeat','فتافيت','entertainment','فتافيت']
].map(x=>({id:x[0],name:x[1],cat:x[2],initials:x[3],url:x[4]||''}));
let state=load(),category='all',query='',current=null,hls=null;
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(!saved)return{channels:BUILTIN.map(x=>({...x})),favorites:[]};let map={};(saved.channels||[]).forEach(c=>map[c.id]=c);let channels=BUILTIN.map(b=>({...b,url:map[b.id]?.url||b.url,customLogo:map[b.id]?.customLogo||''}));channels.push(...(saved.channels||[]).filter(c=>c.userAdded));return{channels,favorites:saved.favorites||[]};}catch(e){return{channels:BUILTIN.map(x=>({...x})),favorites:[]};}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s,error=false){let t=document.getElementById('toast');t.textContent=s;t.className='toast show'+(error?' error':'');setTimeout(()=>t.className='toast',2800)}
function id(){return'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){let d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function catName(c){return CATS.find(x=>x[0]===c)?.[2]||c}
function sidebar(){sidebarEl.innerHTML='<div class="side-label">التصنيفات</div>'+CATS.map(c=>{let n=c[0]==='all'?state.channels.length:c[0]==='favorites'?state.favorites.length:state.channels.filter(x=>x.cat===c[0]).length;return`<div class="cat ${category===c[0]?'active':''}" data-cat="${c[0]}">${c[1]} ${c[2]} <span class="count">${n}</span></div>`}).join('');sidebarEl.querySelectorAll('.cat').forEach(x=>x.onclick=()=>{category=x.dataset.cat;sidebar();render()})}
const sidebarEl=document.getElementById('sidebar');
function render(){let list=state.channels.filter(c=>(category==='all'||(category==='favorites'?state.favorites.includes(c.id):c.cat===category))&&c.name.toLowerCase().includes(query.toLowerCase()));document.getElementById('heading').textContent=catName(category);document.getElementById('total').textContent=list.length+' قناة';grid.innerHTML=list.length?list.map(c=>`<div class="card ${current?.id===c.id?'playing':''}" data-id="${c.id}"><button class="fav" data-fav="${c.id}">${state.favorites.includes(c.id)?'★':'☆'}</button><div class="thumb">${c.customLogo?`<img class="logo-img" src="${esc(c.customLogo)}" onerror="this.remove()">`:''}<span class="initial">${esc(c.initials||c.name.slice(0,3))}</span>${c.url?'':'<div class="unavailable">بدون مصدر بث<br>اضغط لإضافة رابط</div>'}</div><div class="info"><span class="name">${esc(c.name)}</span><span class="tag">${catName(c.cat)}</span></div></div>`).join(''):'<div class="empty-grid">📭<h3>مفيش قنوات في التصنيف ده</h3></div>';grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let c=state.channels.find(x=>x.id===el.dataset.id);c.url?play(c):edit(c.id)});grid.querySelectorAll('.fav').forEach(b=>b.onclick=e=>{e.stopPropagation();let i=state.favorites.indexOf(b.dataset.fav);i<0?state.favorites.push(b.dataset.fav):state.favorites.splice(i,1);save();sidebar();render()})}
const grid=document.getElementById('grid');
function play(c){current=c;document.getElementById('empty').style.display='none';document.getElementById('overlay').style.display='flex';let v=video;if(hls){hls.destroy();hls=null}if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.url;v.play().catch(()=>toast('تعذّر تشغيل القناة',true))}else if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>toast('اضغط تشغيل',true)));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)toast('مصدر البث غير متاح أو به مشكلة',true)})}else{v.src=c.url;v.play().catch(()=>toast('المتصفح لا يدعم المصدر',true))}render()}
const video=document.getElementById('video');
function togglePlay(){video.paused?video.play():video.pause()}function toggleMute(){video.muted=!video.muted;document.getElementById('mute').textContent=video.muted?'🔇':'🔊'}function reload(){if(current)play(current)}function fullscreen(){let p=document.getElementById('player');document.fullscreenElement?document.exitFullscreen():p.requestFullscreen?.()}
video.onplay=()=>document.getElementById('play').textContent='⏸';video.onpause=()=>document.getElementById('play').textContent='▶';document.getElementById('volume').oninput=e=>video.volume=+e.target.value;
document.getElementById('search').oninput=e=>{query=e.target.value;render()};
const modalBg=document.getElementById('modalBg'),modal=document.getElementById('modal');
function openModal(s){modal.innerHTML=s;modalBg.classList.add('open')}function closeModal(){modalBg.classList.remove('open')}
function openSource(){openModal(`<h3>إضافة مصدر بث</h3><p class="desc">أدخل رابط ملف M3U أو الصق محتوى قائمة القنوات.</p><div class="field"><label>نوع المصدر</label><select id="sourceType"><option value="url">رابط بلايليست</option><option value="paste">لصق محتوى M3U</option></select></div><div class="field" id="urlField"><label>رابط M3U</label><input id="sourceUrl" placeholder="https://example.com/list.m3u"></div><div class="field" id="pasteField" style="display:none"><label>محتوى M3U</label><textarea id="sourceText" placeholder="#EXTM3U&#10;#EXTINF:-1,اسم القناة&#10;https://example.com/live.m3u8"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn gold" onclick="submitSource()">إضافة</button></div>`);document.getElementById('sourceType').onchange=e=>{document.getElementById('urlField').style.display=e.target.value==='url'?'block':'none';document.getElementById('pasteField').style.display=e.target.value==='paste'?'block':'none'}}
async function submitSource(){let type=document.getElementById('sourceType').value,text=document.getElementById('sourceText')?.value||'';if(type==='url'){let url=document.getElementById('sourceUrl').value.trim();try{let r=await fetch(url);if(!r.ok)throw Error();text=await r.text()}catch(e){toast('تعذّر تحميل الرابط (قد تكون مشكلة CORS). جرّب لصق المحتوى يدوياً.',true);return}}let added=parseM3U(text);if(!added){toast('محتوى M3U غير صالح أو لا يحتوي قنوات',true);return}save();sidebar();render();closeModal();toast('تمت إضافة '+added+' قناة')}
function parseM3U(text){let lines=text.split(/\r?\n/).map(x=>x.trim()),meta=null,n=0;for(let line of lines){if(line.startsWith('#EXTINF:')){let name=line.match(/,(.+)$/),logo=line.match(/tvg-logo="([^"]*)"/),group=line.match(/group-title="([^"]*)"/);meta={name:name?.[1]?.trim()||'قناة بدون اسم',logo:logo?.[1]||'',group:group?.[1]||''}}else if(line&&!line.startsWith('#')&&meta){if(!state.channels.some(c=>c.url===line)){state.channels.push({id:id(),name:meta.name,cat:guess(meta.group+' '+meta.name),initials:meta.name.slice(0,3),url:line,customLogo:meta.logo,userAdded:true});n++}meta=null}}return n}
function guess(s){s=s.toLowerCase();if(/news|أخبار|نيوز/.test(s))return'news';if(/sport|رياض|سبورت/.test(s))return'sport';if(/drama|درام/.test(s))return'drama';if(/movie|cinema|سينما|أفلام/.test(s))return'cinema';if(/kid|طفل|أطفال/.test(s))return'kids';if(/relig|دين|قرآن|islam/.test(s))return'religious';if(/doc|وثائق/.test(s))return'doc';if(/entertain|ترفيه/.test(s))return'entertainment';return'private'}
function openChannel(){openModal(`<h3>إضافة قناة جديدة</h3><div class="field"><label>اسم القناة</label><input id="newName"></div><div class="field"><label>رابط البث M3U8 أو MP4</label><input id="newUrl" placeholder="https://..."></div><div class="field"><label>التصنيف</label><select id="newCat">${CATS.filter(c=>!['all','favorites'].includes(c[0])).map(c=>`<option value="${c[0]}">${c[2]}</option>`).join('')}</select></div><div class="field"><label>رابط الشعار (اختياري)</label><input id="newLogo"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn gold" onclick="addChannel()">إضافة</button></div>`)}
function addChannel(){let name=document.getElementById('newName').value.trim(),url=document.getElementById('newUrl').value.trim();if(!name||!url){toast('اكتب اسم القناة ورابط البث',true);return}state.channels.push({id:id(),name,url,cat:document.getElementById('newCat').value,initials:name.slice(0,3),customLogo:document.getElementById('newLogo').value.trim(),userAdded:true});save();sidebar();render();closeModal();toast('تمت إضافة القناة')}
function edit(cid){let c=state.channels.find(x=>x.id===cid);openModal(`<h3>تعديل ${esc(c.name)}</h3><div class="field"><label>اسم القناة</label><input id="editName" value="${esc(c.name)}"></div><div class="field"><label>رابط البث</label><input id="editUrl" value="${esc(c.url)}"></div><div class="field"><label>التصنيف</label><select id="editCat">${CATS.filter(x=>!['all','favorites'].includes(x[0])).map(x=>`<option value="${x[0]}" ${x[0]===c.cat?'selected':''}>${x[2]}</option>`).join('')}</select></div><div class="field"><label>رابط الشعار</label><input id="editLogo" value="${esc(c.customLogo||'')}"></div><div class="modal-actions">${c.userAdded?`<button class="btn" onclick="deleteChannel('${cid}')">حذف</button>`:''}<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn gold" onclick="saveChannel('${cid}')">حفظ</button></div>`)}
function saveChannel(cid){let c=state.channels.find(x=>x.id===cid);c.name=document.getElementById('editName').value.trim()||c.name;c.url=document.getElementById('editUrl').value.trim();c.cat=document.getElementById('editCat').value;c.customLogo=document.getElementById('editLogo').value.trim();save();sidebar();render();closeModal();toast('تم الحفظ');if(current?.id===cid&&c.url)play(c)}
function deleteChannel(cid){if(!confirm('تحذف القناة؟'))return;state.channels=state.channels.filter(x=>x.id!==cid);state.favorites=state.favorites.filter(x=>x!==cid);if(current?.id===cid){video.pause();current=null;document.getElementById('empty').style.display='flex';document.getElementById('overlay').style.display='none'}save();sidebar();render();closeModal();toast('تم حذف القناة')}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.code==='KeyF')fullscreen();if(e.code==='KeyM')toggleMute()});
sidebar();render();
</script></body></html>
